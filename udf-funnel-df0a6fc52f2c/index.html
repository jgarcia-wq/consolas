      <div class="bn">si cada tasa hubiera cumplido el plan</div></div>

   <h2>Cada etapa contra la propuesta</h2>
   <p class="note">Barra gris, el plan del periodo completo. Barra naranja, lo real al 9 de septiembre.
    Las barras usan escala de raíz cuadrada para que las etapas chicas sigan siendo legibles junto a las impresiones.</p>
   <div class="fnl">${fnl}</div>
   <div class="callout">El embudo se invirtió respecto a la propuesta. <b>Arriba sobra</b>: los leads van al
    ${Math.round(C.real.leads/DATA.plan.leads*100)}% y las conversaciones al ${Math.round(C.real.conversaciones/DATA.plan.conversaciones*100)}%
    de lo comprometido para todo el periodo, faltando tres semanas. <b>Abajo falta</b>: los inscritos van al
    ${Math.round(C.real.inscritos/DATA.plan.inscritos*100)}%. No es un problema de demanda ni de inversión.</div>
   <div class="callout"><b>Cómo se cuenta el inscrito.</b> La cifra final suma <b>inscritos y preinscritos</b>,
    igual que los cuenta UDF: el preinscrito ya apartó lugar o pagó, y el equipo comercial lo trata como cerrado.

    ${n(T.preinscritos)} están en Preinscrito. El desglose aparece en cada tabla para que se vea de qué está
    hecho el número, pero todos los totales y todas las tasas usan la suma.</div>

   <p class="note">Sin prorratear: meta del periodo completo contra lo real al 9 de septiembre, a 79 de 101 días.</p>

    <tbody>${C.volumen.map(v=>`<tr><td class="l">${MET[v.metrica]}</td><td>${n(v.meta)}</td><td>${n(v.real)}</td>

              "2025":['v','pauta ciclos anteriores'],"Orgánico":['w','orgánico']};
  const tabla=r=>`<div class="scroll"><table><thead><tr><th class="l">Pipeline</th><th class="l">Origen</th>
    <th>Llegaron a Inscrito</th><th>Sólo Preinscrito</th><th>Suma</th><th>Creados antes del ciclo</th></tr></thead><tbody>`+
    r.filas.map(f=>`<tr><td class="l">${f.pipeline}</td>
      <td class="l">${(o=>`<span class="pill ${o[0]}">${o[1]}</span>`)(ORIG[f.pipeline]||['w','otra fuente'])}</td>
      <td>${n(f.inscritos)}</td><td>${n(f.pre)}</td><td><b>${n(f.suma)}</b></td><td>${f.previos?n(f.previos):"—"}</td></tr>`).join("")+
    `<tr class="tot"><td class="l">Total</td><td></td><td>${n(r.inscritos)}</td><td>${n(r.pre)}</td>
      <td>${n(r.total)}</td><td></td></tr></tbody></table></div>`;
  return `<div class="callout">Ventana <b>1 de junio al 9 de septiembre</b>. Se cuenta toda <b>entrada</b> a
    Preinscrito o Inscrito ocurrida dentro de ella, tomada del historial de cada trato, sin importar el pipeline
    ni dónde esté el trato hoy — incluye ${n(5)} tratos que después salieron a Perdido y que un conteo por etapa
    actual no vería. <b>Exacer queda fuera</b>: es un curso de preparatoria con meta propia, ajeno a los
    ${n(DATA.plan.inscritos)} de licenciatura y posgrado.</div>
   <div class="big">
     <div><div class="bk">Reporta UDF al 27 ago</div><div class="bv">${n(R.reportado_udf_27ago)}</div>
      <div class="bn">"digitales" en su hoja</div></div>
     <div><div class="bk">Entraron al 27 ago</div><div class="bv">${n(A.total)}</div>
      <div class="bn">${n(A.inscritos)} a Inscrito + ${n(A.pre)} sólo Preinscrito</div></div>
     <div><div class="bk">De pauta del ciclo al 27 ago</div><div class="bv" style="color:var(--orange)">${n(A.pauta)}</div>
      <div class="bn">${Math.round(A.pauta/A.total*100)}% del total · el resto es pauta de ciclos anteriores y orgánico</div></div>
     <div><div class="bk">De pauta del ciclo al 9 sep</div><div class="bv" style="color:var(--orange)">${n(B.pauta)}</div>
      <div class="bn">${Math.round(B.pauta/DATA.plan.inscritos*100)}% de los ${n(DATA.plan.inscritos)} comprometidos</div></div></div>
   <h2>Por qué nuestro número y el de UDF no coinciden</h2>
   <p class="note">Ninguna razón es un error de medición: son criterios de conteo distintos. Conviene acordarlos
    antes de la sesión, o cada quien llegará con una cifra diferente y la discusión se irá ahí.</p>
   <div class="rates">
    <div class="rate" style="grid-template-columns:1fr"><div><b>1 · UDF suma los preinscritos.</b>
     Son ${n(A.pre)} de los ${n(A.total)} al 27 de agosto. El equipo comercial trata al preinscrito como cerrado,
     así que su criterio es legítimo — sólo hay que declararlo. Nosotros veníamos reportando sólo la etapa Inscrito,
     y de ahí sale el 43 del resto de este reporte.</div></div>
    <div class="rate" style="grid-template-columns:1fr"><div><b>2 · UDF suma todas las fuentes.</b>
     El pipeline 2025 aporta ${n(q(A,"2025","suma"))} al 27 de agosto, y ${n(q(A,"2025","previos"))} de esos son
     tratos creados <em>antes</em> del ciclo. Es <b>pauta de ciclos anteriores</b>: demanda que esta agencia

     ${n(q(A,"Orgánico","suma"))}.</div></div>
    <div class="rate" style="grid-template-columns:1fr"><div><b>3 · Las tres primeras semanas de junio son anteriores a la pauta.</b>
     Hubo ${n(R.antes_del_22jun.total)} entradas entre el 1 y el 21 de junio y <b>las
     ${n(R.antes_del_22jun.total)} son del pipeline 2025</b>. Las campañas de este ciclo arrancaron el 22 de junio,

   </div>

    ${Math.round(DATA.consolidado.real.inscritos/DATA.plan.inscritos*100)}% que sale de contar sólo inscritos de la pauta del ciclo.

    cargar sola con los ${n(336)}.</div>

const PAUTA_HOY=["Meta CTWA","Meta CTWA recuperado del historial"], PAUTA_ANT=["Pauta ciclos anteriores"];
function fuentesHTML(b,titulo,nota){
  if(!b||!b.filas.length) return "";
  const clase=f=>PAUTA_HOY.includes(f)?"d0":PAUTA_ANT.includes(f)?"d1":"d2";
  const filas=b.filas.map(f=>{
    const camps=Object.keys(f.campanas||{});
    const pipes=Object.keys(f.pipelines||{});
    return `<div class="sr"><div class="f"><span class="dot ${clase(f.fuente)}"></span>${f.fuente}</div>
      <div class="m">${n(f.ins)}</div><div class="m">${n(f.pre)}</div><div class="m"><b>${n(f.total)}</b></div>
      <div class="who">${camps.length?camps.length+" camp.":pipes.join(" · ")}</div></div>`;}).join("");
  return `<h2>${titulo}</h2>${nota?`<p class="note">${nota}</p>`:""}
   <div class="src"><div class="srh"><span>Fuente</span><span>Inscritos</span><span>Preinsc.</span><span>Total</span><span>Origen</span></div>
   ${filas}
   <div class="sr" style="border-top:1px solid var(--line-2)"><div class="f"><b>Total</b></div>
     <div class="m"><b>${n(b.ins)}</b></div><div class="m"><b>${n(b.pre)}</b></div>
     <div class="m"><b>${n(b.total)}</b></div><div class="who"></div></div></div>`;
}

     <b>40 tratos</b> cuya fuente actual no era Meta (27 del botón, 10 sin rastreo, 3 orgánicos), uno por uno.
     Sólo <b>2</b> conservan un <code>ctwaClid</code>: nacieron de un anuncio CTWA pagado y volvieron después
     por el sitio. Uno más trae <code>fbclid</code>, es decir un clic de Meta que no fue CTWA. Con eso,
     el total atribuible a Meta sube de ${n(mCTWA.total)} a <b>${n(metaTot)}</b> y deja de ser un piso.</div>
   <div class="callout"><b>Los 16 sin rastreo ni registro.</b> 10 llegaron a Patagon como <code>untracked</code>
     y 6 no existen en Patagon pese a estar en un pipeline de pauta. Se reportan como categoría propia en vez
     de repartirlos entre las rutas.</div>
   <h2>Detalle por trato</h2>
   <p class="note">Los ${n(F.detalle.length)} tratos con la fecha exacta de entrada a cada etapa. Apellidos abreviados;
    el archivo con nombres completos es <code>Detalle_Inscritos_Preinscritos_1jun-9sep.csv</code>.</p>
   <div class="callout"><b>Cada número de trato abre Pipedrive en una pestaña nueva.</b>
    Las columnas de CRM vienen de los campos <i>Fuente</i>, <i>Campaña</i> y <i>Contenido</i> de la persona,
    que el equipo llena aparte de Patagon: cubren el ${Math.round(F._cobertura.campana_crm/F._total*100)}% de los
    tratos, incluyendo los de ciclos anteriores y los de Google, que Patagon no ve.</div>
   ${detalleHTML(F.detalle)}`;
  panes.appendChild(s);})();
(function(){const i=DATA.meses.length+3, PR=DATA.proyeccion;
  const b=document.createElement("button");
  b.setAttribute("role","tab"); b.id="t"+i; b.setAttribute("aria-controls","p"+i);
  b.setAttribute("aria-selected","false");
  b.dataset.n="Proyección de cierre"; b.innerHTML=`Proyección de cierre<span class="dim">30 sep</span>`;
  b.onclick=()=>sel(i); tabs.appendChild(b);
  const col={Pesimista:"bad",Realista:"orange",Optimista:"good"};
  const BG={Pesimista:"var(--bad-bg)",Realista:"var(--warn-bg)",Optimista:"var(--good-bg)"};
  const tarjetas=["Pesimista","Realista","Optimista"].map(k=>{const v=PR.escenarios[k];
    return `<div><div class="en" style="color:var(--${col[k]})">${k}</div>
      <div class="mas" style="background:${BG[k]};color:var(--${col[k]})">+${n(v.adicionales)} inscritos más</div>
      <div class="ev">${n(v.cierre_30sep)}</div>
      <div class="ep">total al 30 sep · ${Math.round(v.cierre_30sep/DATA.plan.inscritos*100)}% de los ${n(DATA.plan.inscritos)} de pauta</div>
      <div class="eb"><span>Ya tenemos hoy</span><span>${n(PR.base.inscritos)}</span></div>
      <div class="eb"><span>+ cierra del pipeline</span><span>+${n(v.pipeline_aporta)}</span></div>
      <div class="eb"><span>+ leads nuevos que maduran</span><span>+${n(v.nuevos_en_sep)}</span></div>
      <div class="eb" style="border-top:1px solid var(--line-2);margin-top:4px;padding-top:5px;font-weight:600">
        <span>= cierre al 30 sep</span><span>${n(v.cierre_30sep)}</span></div>
      <div class="eb" style="color:var(--ink-3)"><span>después, en octubre</span><span>+${n(v.nuevos_cola_octubre)}</span></div>
      <div class="eb" style="color:var(--ink-3)"><span>otras fuentes, aparte</span><span>+${n(v.otras_fuentes_restante)}</span></div>
      <div class="es">${v.supuesto}</div></div>`;}).join("");
  const D3=["Pesimista","Realista","Optimista"].map(k=>PR.escenarios[k]);
  const det=PR.escenarios.Realista.detalle.map(d=>`<tr><td class="l">${d.etapa}</td><td>${n(d.vivos)}</td>
    <td>${d.tasa.toFixed(1)}%</td><td>${d.aporta.toFixed(1)}</td></tr>`).join("");
  const s=document.createElement("section");
  s.className="mes"; s.id="p"+i; s.setAttribute("role","tabpanel"); s.setAttribute("aria-labelledby","t"+i);
  s.hidden=true;
  s.innerHTML=`<div class="callout">Proyección de la <b>pauta de este ciclo</b> (pipelines Patagon y P. Refresh)
     al cierre del 30 de septiembre. Parte de los ${n(PR.base.inscritos)} inscritos ya logrados, suma lo que cierre
     del pipeline vivo y lo que alcancen a madurar los leads que faltan por generar. Todo sobre tasas medidas en
     este ciclo, no supuestos.</div>
   <div class="delta">
     <div><div class="dk">Ya tenemos hoy</div><div class="dv">${n(PR.base.inscritos)}</div>
       <div class="dn">inscritos de pauta al 9 sep</div></div>
     <div><div class="dk">Faltan por sumar</div>
       <div class="dv" style="color:var(--orange)">+${n(D3[0].adicionales)} a +${n(D3[2].adicionales)}</div>
       <div class="dn">según el escenario · realista +${n(D3[1].adicionales)}</div></div>
     <div><div class="dk">Cierre al 30 sep</div>
       <div class="dv">${n(D3[0].cierre_30sep)} a ${n(D3[2].cierre_30sep)}</div>
       <div class="dn">realista ${n(D3[1].cierre_30sep)}</div></div>
     <div><div class="dk">Faltarían para los ${n(DATA.plan.inscritos)}</div>
       <div class="dv" style="color:var(--bad)">${n(DATA.plan.inscritos-D3[1].cierre_30sep)}</div>
       <div class="dn">brecha en el escenario realista</div></div></div>
   <div class="esc">${tarjetas}</div>
   <h2>De dónde sale cada número</h2>
   <p class="note">Ritmo actual de septiembre: <b>${money(PR.gasto_dia)}/día</b> y <b>${PR.leads_dia} leads/día</b>,
    con <b>${PR.dias_restantes} días</b> hasta el 30 de septiembre. Posgrado cierra antes, el 26.</p>
   <div class="scroll"><table><thead><tr><th class="l">Etapa del pipeline</th><th>Tratos vivos</th>
     <th>Tasa histórica a Inscrito</th><th>Aporta (realista)</th></tr></thead><tbody>${det}
     <tr class="tot"><td class="l">Total del pipeline</td><td>${n(Object.values(PR.vivo).reduce((a,b)=>a+b,0))}</td>
      <td></td><td>${n(PR.escenarios.Realista.pipeline_aporta)}</td></tr></tbody></table></div>
   <div class="callout"><b>El pipeline pesa el doble que los leads nuevos.</b> Los ${n(381-35)} tratos vivos que
     todavía no son inscritos aportan ${n(PR.escenarios.Realista.pipeline_aporta)} contra
     ${n(PR.escenarios.Realista.nuevos_en_sep)} de las tres semanas de pauta que quedan. A estas alturas del ciclo
     cerrar lo que ya está adentro rinde más que comprar demanda nueva: un lead generado el 25 de septiembre casi
     no alcanza a madurar antes del corte.</div>
   <div class="callout"><b>Criterio de conteo.</b> La base de ${n(PR.base.inscritos)} son inscritos finales:
     ${n(PR.base.estrictos)} en etapa Inscrito más ${n(PR.base.preinscritos)} en Preinscrito. Por eso los
     ${n(35)} preinscritos vivos <b>no aparecen</b> en la tabla del pipeline: ya están contados en la base, y
     volver a sumarlos sería contarlos dos veces. Lo que aportan es pasar de Preinscrito a Inscrito, que no
     cambia el total.</div>
   <div class="callout"><b>Lo que la proyección no puede saber.</b> No modela el tope de la cuenta de Meta,
     ni una recuperación de la calificación tras el bloqueo de WhatsApp del 31 de agosto —septiembre lleva
     8 MQL contra 152 de agosto—, ni un empujón comercial sobre los ${n(120)} leads de 3★ que hoy están parados.
     Cualquiera de los tres mueve el resultado fuera del rango.</div>`;
  panes.appendChild(s);})();
function sel(id){
  if(typeof id==="number") id="p"+id;
  [...tabs.children].forEach(b=>{
    const on=b.getAttribute("aria-controls")===id;
    b.setAttribute("aria-selected",on?"true":"false");
    const pane=document.getElementById(b.getAttribute("aria-controls"));
    if(pane) pane.hidden=!on;
  });
}
// Orden de pestañas pedido por el equipo. Lo que no esté aquí se va al final.
(function(){
  const ORDEN=["Consolidado","Junio","Julio","Agosto","Septiembre",
               "Reconciliación","Inscritos y preinscritos","Proyección de cierre"];
  const bs=[...tabs.children];
  const mover=b=>{tabs.appendChild(b);
    const pane=document.getElementById(b.getAttribute("aria-controls"));
    if(pane) panes.appendChild(pane);};
  ORDEN.forEach(nom=>{const b=bs.find(x=>x.dataset.n===nom); if(b) mover(b);});
  bs.filter(b=>!ORDEN.includes(b.dataset.n)).forEach(mover);
  sel(tabs.children[0].getAttribute("aria-controls"));
})();
tabs.addEventListener("keydown",e=>{
 const b=[...tabs.children],i=b.findIndex(x=>x.getAttribute("aria-selected")==="true");
 const ir=j=>{const t=b[(j+b.length)%b.length]; sel(t.getAttribute("aria-controls")); t.focus(); e.preventDefault();};
 if(e.key==="ArrowRight") ir(i+1);
 if(e.key==="ArrowLeft")  ir(i-1);});
document.getElementById("foot").innerHTML=
 `Corte ${DATA.corte} · Meta: impresiones, gasto y leads (conexión de WhatsApp + formulario instantáneo) · `+
 `Patagon: conversaciones y MQL (4★ y 5★), filtro source=meta · Pipedrive: SQL (alcanzó Visita agendada o posterior) `+
 `e inscritos, por historial de etapas, pipelines Patagon y P. Refresh.<br>`+
 `Fuera del alcance: pipeline Orgánico, pipeline Exacer y ciclo 2025. Plan del periodo: `+
 `${n(DATA.plan.leads)} leads → ${n(DATA.plan.mql)} MQL → ${n(DATA.plan.sql)} SQL → ${n(DATA.plan.inscritos)} inscritos de pauta.`;
